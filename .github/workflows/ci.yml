name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Analiz fonksiyonlari tarayici gerektirmez; testler icin Playwright kurmuyoruz.
      - run: pip install "pydantic>=2.9,<3.0" "pydantic-settings>=2.6,<3.0" pytest
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t google-ai-mode-api:ci .
