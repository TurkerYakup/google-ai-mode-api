name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pytest>=7: pytest.ini icindeki 'pythonpath' secenegi o surumle geldi.
      - run: pip install "pydantic>=2.9,<3.0" "pydantic-settings>=2.6,<3.0" "pytest>=7" playwright
      # extract.js testleri gercek DOM API'leri gerektirdigi icin Chromium sart.
      # Google'a istek gitmez: fixture'lar route ile yerel olarak sunulur.
      - run: playwright install --with-deps chromium
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t google-ai-mode-api:ci .
