name: Release

# v* bicimli bir etiket push edildiginde calisir:
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0
#
# Iki isi birden yapar: imaji GHCR'ye yayinlar (repo'nun Packages bolumu) ve
# etiketten bir GitHub Release olusturur (Releases bolumu). Ikisi de deponun
# kendi GITHUB_TOKEN'iyla calisir, ek secret gerekmez.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # v0.2.0 -> 0.2.0, 0.2, latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Imajin buyuk kismi Chromium; katman onbellegi olmadan her surum ~6 dk surer.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The release body is the annotated tag's own message, so release notes
      # are written once (in English) at tag time and never drift from the tag.
      # Commit subjects are Turkish; --generate-notes would paste them into an
      # otherwise English release page, so it is deliberately not used.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -l --format='%(contents)' "${{ github.ref_name }}" > notes.md
          printf '\n---\n\nContainer image: `ghcr.io/%s:%s`\n' \
            "${{ github.repository }}" "${{ github.ref_name }}" >> notes.md
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md
