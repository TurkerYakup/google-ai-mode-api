name: Release

# v* bicimli bir etiket push edildiginde calisir:
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0
#
# Iki isi birden yapar: imaji GHCR'ye yayinlar (repo'nun Packages bolumu) ve
# etiketten bir GitHub Release olusturur (Releases bolumu). Ikisi de deponun
# kendi GITHUB_TOKEN'iyla calisir, ek secret gerekmez.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # v0.2.0 -> 0.2.0, 0.2, latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Imajin buyuk kismi Chromium; katman onbellegi olmadan her surum ~6 dk surer.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The release body is the annotated tag's own message, so release notes
      # are written once (in English) at tag time and never drift from the tag.
      # Commit subjects are Turkish; --generate-notes would paste them into an
      # otherwise English release page, so it is deliberately not used.
      #
      # The message is read over the API rather than with `git tag -l`, because
      # actions/checkout leaves the tag as a lightweight ref -- `%(contents)`
      # then silently falls back to the *commit* message and the release ships
      # with the wrong body.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          obj=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.sha')
          type=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.type')
          if [ "$type" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag. Release notes come from the" \
                 "annotation -- create it with 'git tag -a $TAG -F notes.md'."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/git/tags/$obj" --jq '.message' > notes.md
          printf '\n---\n\nContainer image: `ghcr.io/%s:%s`\n' \
            "${{ github.repository }}" "$TAG" >> notes.md

          # Re-running a tag must converge on the same release, not fail on a
          # leftover one. --cleanup-tag is left off so the tag itself survives.
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
