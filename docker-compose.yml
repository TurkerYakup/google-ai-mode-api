services:
  google-ai-mode-api:
    # Hazir imaji cekmek icin:  docker compose pull && docker compose up -d
    # Kaynaktan derlemek icin:  docker compose up -d --build
    image: ghcr.io/turkeryakup/ai-mode-api:latest
    build: .
    container_name: google-ai-mode-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      # Cerezler/oturum burada kalir. Adlandirilmis volume kullaniyoruz: Docker ilk
      # olusturmada imajdaki sahipligi (app:app) kopyalar, boylece container root
      # olmadan yazabilir. Bind mount'a gecerseniz (`./data/profile:/data/profile`)
      # dizini once host'ta olusturup `chown -R 1000:1000 ./data` yapmalisiniz --
      # aksi halde uygulama profil dizinini yaratamaz ve baslamaz.
      - profile:/data/profile
    # Chromium paylasimli bellek olmadan sekme cokerttir.
    shm_size: "1gb"
    security_opt:
      - seccomp=unconfined
    # Kacak bir Chromium surecinin host'u bogmamasi icin ust sinir.
    mem_limit: 2g
    # Docker'in json-file surucusu varsayilan olarak SINIRSIZ buyur. Her istek
    # loglandigi icin uzun calisan kurulumda disk doldurur. 30 MB'da tutuyoruz.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  profile:
